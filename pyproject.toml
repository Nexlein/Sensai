[project]
name = "sensai"
version = "0.1.0"
description = "< WATASHI WA NIHONGO O SUKOSHI SHIKA HANASEMASEN />"
readme = "README.md"
authors = [
    { name = "Nielsen Combe-Bracciale (Nexlein)", email = "nielsen.combe-bracciale@epitech.eu" },
    { name = "Bertrand Teddy (Bertrand Teddy)", email = "teddy.bertrand@epitech.eu" },
    { name = "Aberkane Mathys (Vulcaaa)", email = "mathys.aberkane@epitech.eu" },
    { name = "Lambrez Alban (Saitamadupauvre)", email = "alban.lambrez@epitech.eu" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.4",
]

[project.scripts]
sensai = "sensai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
