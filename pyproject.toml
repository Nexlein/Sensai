[project]
name = "sensai"
version = "0.1.0"
description = "< WATASHI WA NIHONGO O SUKOSHI SHIKA HANASEMASEN />"
readme = "README.md"
authors = [
    { name = "Nielsen Combe-Bracciale (Nexlein)", email = "nielsen.combe-bracciale@epitech.eu" },
    { name = "Bertrand Teddy (Bertrand Teddy)", email = "teddy.bertrand@epitech.eu" },
    { name = "Aberkane Mathys (Vulcaaa)", email = "mathys.aberkane@epitech.eu" },
    { name = "Lambrez Alban (Saitamadupauvre)", email = "alban.lambrez@epitech.eu" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tomlkit>=0.15.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sensai = "sensai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "hypothesis>=6.168.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
# uv.lock uses the 0.13 format; older uv versions fail on it.
required-version = ">=0.13.5"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: needs a real model server or Docker; skipped unless its env var is set",
]

[tool.coverage.run]
source = ["sensai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 96

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
