# Moves issues across the project board. Managed by project-bootstrap [ba4938f0318cf6bd]: `pb github board`
# sets the repository variables BOARD_OWNER / BOARD_NUMBER and the PROJECT_TOKEN secret
# (classic PAT, scopes repo + project: GITHUB_TOKEN cannot reach Projects).
name: Project board

on:
  issues:
    types: [opened, reopened, assigned, unassigned]
  create:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

# One queue per issue / pull request / branch. A single global group loses events:
# GitHub keeps only the newest pending run of a group and cancels the others.
concurrency:
  group: project-board-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: vars.BOARD_NUMBER != '' && (github.event_name != 'create' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_OWNER: ${{ vars.BOARD_OWNER }}
      PROJECT_NUMBER: ${{ vars.BOARD_NUMBER }}
      DEV_BRANCH: ${{ vars.BOARD_DEV_BRANCH || 'dev' }}
      MAIN_BRANCH: ${{ github.event.repository.default_branch }}
      DEFAULT_PRIORITY: ${{ vars.BOARD_DEFAULT_PRIORITY || 'Medium' }}
      HAS_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::PROJECT_TOKEN secret missing, board not updated (run pb github board)"
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - if: env.HAS_TOKEN == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          retries: 3
          script: |
            const run = require('./.github/scripts/project-board.js');
            await run({ github, context, core });
