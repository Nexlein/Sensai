name: Feature request
description: Suggest a new capability or an improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution: a clear need makes it easier to find
        the right design, which may differ from the first idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, hard or slow today? Who is affected?
      placeholder: "When I ..., I have to ..., because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. API sketches or examples welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds, and why they fall short.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we will know it is done.
      value: |
        - [ ]
        - [ ]

  - type: dropdown
    id: priority
    attributes:
      label: How important is it to you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
