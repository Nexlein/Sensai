{{- if .Values.gateway.domain }}
# The application's single public entry point: one HTTP listener served by Traefik
# (GatewayClass `traefik`, installed by scripts/install-gateway.sh), behind the one
# LoadBalancer public IP of the Traefik Service. poll and result are told apart by
# host name in the HTTPRoutes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      # Container port of Traefik's `web` entry point, not the 80 of the Service.
      port: {{ .Values.gateway.port }}
      # Only this release's routes may attach.
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
