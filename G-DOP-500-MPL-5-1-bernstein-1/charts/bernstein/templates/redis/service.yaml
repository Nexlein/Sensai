# Stable address used by poll and worker: redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bernstein.selectorLabels" (dict "context" $ "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Governing Service of the StatefulSet: gives the pod a stable DNS name,
# redis-0.redis-headless.<namespace>.svc.
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "redis") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "bernstein.selectorLabels" (dict "context" $ "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
