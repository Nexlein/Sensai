# Stable address used by worker and result: postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bernstein.selectorLabels" (dict "context" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Governing Service of the StatefulSet: gives the pod a stable DNS name,
# postgres-0.postgres-headless.<namespace>.svc.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "bernstein.selectorLabels" (dict "context" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
