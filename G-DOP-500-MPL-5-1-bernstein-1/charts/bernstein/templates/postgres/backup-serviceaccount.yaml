{{- if .Values.postgres.backup.enabled }}
# The identity the backup pod presents to Azure. The annotation names the managed
# identity whose federated credential has this ServiceAccount as subject
# (system:serviceaccount:<namespace>:postgres-backup, see infra/terraform/main.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "postgres") | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "values: postgres.backup.clientId is required when postgres.backup.enabled" .Values.postgres.backup.clientId | quote }}
{{- end }}
