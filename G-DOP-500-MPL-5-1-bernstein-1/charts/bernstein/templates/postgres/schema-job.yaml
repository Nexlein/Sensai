# Applies schema.sql before each upgrade. The first install is covered by the initdb
# ConfigMap mounted in the StatefulSet (a post-install hook would deadlock `--wait`).
# The SQL is idempotent (CREATE TABLE IF NOT EXISTS), so running it again is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-schema
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "postgres") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  # Gives up (and fails the release) if PostgreSQL never becomes reachable.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "bernstein.labels" (dict "context" $ "component" "postgres") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: schema
          image: {{ include "bernstein.image" (dict "context" $ "component" "postgres") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # psql and pg_isready read these PG* variables themselves.
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bernstein.secretName" (dict "context" $ "component" "postgres") }}
                  key: password
          command:
            - sh
            - -ec
            - |
              until pg_isready -q; do
                echo "waiting for postgres"
                sleep 2
              done
              psql -v ON_ERROR_STOP=1 -f /schema/schema.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: schema
          configMap:
            name: postgres-schema
