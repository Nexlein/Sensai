apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "bernstein.labels" (dict "context" $ "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  # A new worker must be Ready (Redis and PostgreSQL reachable) for 5 s before an old
  # one is removed, so votes keep being consumed during the rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  # Old ReplicaSets kept for `helm rollback`.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "bernstein.selectorLabels" (dict "context" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bernstein.labels" (dict "context" $ "component" "worker") | nindent 8 }}
      annotations:
        checksum/redis-secret: {{ include "bernstein.secretChecksum" (dict "context" $ "component" "redis") }}
        checksum/postgres-secret: {{ include "bernstein.secretChecksum" (dict "context" $ "component" "postgres") }}
    spec:
      # The worker receives no traffic, so no preStop sleep is needed: the JVM
      # handles SIGTERM at once. 40 s matches poll and result.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        # The `app` user of the image (see poll-application/worker/Dockerfile).
        runAsUser: 10001
        runAsGroup: 10001
        # The health server listens on port 80 as a non-root user: lower the first
        # port unprivileged processes may bind. Scoped to this pod's network namespace.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      # Pods of one component on different nodes (and zones), so a drain or a node
      # loss never takes all of them. A preference, not a rule: see the helper.
      topologySpreadConstraints:
        {{- include "bernstein.topologySpread" (dict "context" $ "component" "worker") | trim | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "bernstein.image" (dict "context" $ "component" "worker") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Nothing calls the worker except the kubelet probes: no Service.
          ports:
            - name: health
              containerPort: 80
          env:
            {{- include "bernstein.env.redis" (dict "context" $) | nindent 12 }}
            {{- include "bernstein.env.postgres" (dict "context" $) | nindent 12 }}
          # The health server starts before the worker connects to anything, so
          # /healthz answers while Redis or PostgreSQL are still starting (the worker
          # retries both connections every second). Liveness stays on /healthz: a
          # Redis or database outage must not restart the pods (the process exits by
          # itself on an error). Readiness (/readyz) checks both, so a pod that lost
          # one of them is shown NotReady.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
