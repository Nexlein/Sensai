apiVersion: v2
name: bernstein
description: Poll application (poll, worker, result, Redis, PostgreSQL) for the Bernstein project.
type: application
# Version of the chart itself: bump it on every change to templates, values or schema.
version: 0.1.0
# Version of the application. The deploy sets it to the git SHA being deployed
# (`helm package --app-version <sha>`), so `helm history` shows which commit each
# revision runs. Resource labels use `global.tag` instead, which is always set.
appVersion: "dev"
