# Sensai configuration for the Régie de collecte du Val-Brûlé (defense setup).
#
# Copy it once, then edit your copy (sensai.toml is ignored by Git):
#   cp sensai.example.toml sensai.toml
#
# Priority: CLI flags > sensai.toml > built-in defaults. Every section is optional.
# This file turns on exactly the features we present, and turns the others off.
#
#   On:  X1 Web UI, A5 Persona, R1 RAG, EV2 Guardrails, M3 Structured memory,
#        T4 File access, A3 Confirmation before writing, M1 Sessions (--session).
#   Off: T1 MCP, T2 Sandbox, T3 Web search, A1 Reasoning loop, M2 Compression,
#        EV1 Reply logging for the judge.

interface = "web"                    # X1: cli | tui | web (http://127.0.0.1:8000)
provider = "ollama"                  # local model only: user data never leaves the PC
model = "qwen3.5:4b"
base_url = "http://localhost:11434"
autosave = false                     # changes made in a session (/persona off...) stay in the session

[options]                            # sent to Ollama with every request
temperature = 0.0                    # measured best for factual answers (docs/benchmarks.md)
seed = 42                            # same question, same answer: rehearsals match the show
num_ctx = 8192                       # context window, in tokens
num_predict = 1024                   # longest reply, in tokens

[budget]
max_tokens = 7168                    # must stay <= num_ctx - num_predict
enabled = false                      # M2 off: tokens are counted, old turns are kept as is

[persona]                            # A5: the Régie assistant, first in every prompt
enabled = true                       # /persona off and /persona on switch it live
name = "Sensai Collecte"
file = "personas/collecte.md"

[rag]                                # R1: answers come from the Régie documents
enabled = true
dir = "data/collecte"
model = "bge-m3"                     # multilingual: finds French documents nomic-embed-text misses
db = "rag.db"
top_k = 3                            # 3 excerpts: enough with bge-m3, and a shorter prompt to read
chunk_size = 500
chunk_overlap = 50

[guardrails]                         # EV2: on input, model output and tool results
enabled = true
injection = "block"                  # block | flag
pii = "redact"                       # redact | block

[memory]                             # M3: facts kept across sessions, see /memory
enabled = true
auto_inject = true

[tools]
fs_allowed_root = "."                # T4: files under the launch folder only; writes ask first (A3)
web_search = false                   # T3 off
sandbox = false                      # T2 off

[reasoning]
enabled = false                      # A1 off

[eval]
log_prompts = true                   # full prompt of every model call in logs/prompts.jsonl
log_replies = false                  # EV1 off
