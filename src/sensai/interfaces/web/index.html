<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sensai</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1a1b26; color: #c0caf5; }
      #log { flex: 1; overflow-y: auto; padding: 1rem; }
      .msg { white-space: pre-wrap; margin: 0 0 1rem; }
      .user::before { content: "you: "; color: #7aa2f7; font-weight: bold; }
      .assistant::before { content: "sensai: "; color: #bb9af7; font-weight: bold; }
      .notice { color: #e0af68; }
      .error { color: #f7768e; }
      .usage { color: #565f89; font-size: 0.85rem; }
      #confirm { display: none; padding: 0.75rem 1rem; background: #24283b; border-top: 1px solid #414868; }
      #confirm pre { margin: 0.5rem 0; max-height: 12rem; overflow: auto; }
      form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-top: 1px solid #414868; }
      input { flex: 1; padding: 0.5rem; background: #24283b; color: inherit; border: 1px solid #414868; border-radius: 4px; }
      button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="confirm">
      <strong id="confirm-title"></strong>
      <pre id="confirm-body"></pre>
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
    <form id="form">
      <input id="text" autocomplete="off" autofocus placeholder="Message or /command" />
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" disabled>Stop</button>
    </form>
    <script>
      const log = document.getElementById("log");
      const input = document.getElementById("text");
      const send = document.getElementById("send");
      const stop = document.getElementById("stop");
      const confirmBox = document.getElementById("confirm");
      const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
      let reply = null;

      function add(cls, text) {
        const el = document.createElement("div");
        el.className = `msg ${cls}`;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }
      function setBusy(busy) {
        send.disabled = busy;
        stop.disabled = !busy;
      }
      function answer(approved) {
        confirmBox.style.display = "none";
        socket.send(JSON.stringify({ type: "confirm", approved }));
      }

      socket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === "history") {
          data.messages.forEach((m) => add(m.role, m.content));
        } else if (data.type === "text_chunk") {
          if (!reply) reply = add("assistant", "");
          reply.textContent += data.content;
          log.scrollTop = log.scrollHeight;
        } else if (data.type === "confirm") {
          document.getElementById("confirm-title").textContent = data.title;
          const lines = data.details.map(([k, v]) => `${k}: ${v}`);
          document.getElementById("confirm-body").textContent = [...lines, data.preview || ""].join("\n");
          confirmBox.style.display = "block";
        } else if (data.type === "done") {
          reply = null;
          confirmBox.style.display = "none";
          setBusy(false);
        } else {
          add(data.type, data.message);
          if (data.type === "error") setBusy(false);
        }
      };
      socket.onclose = () => { add("error", "Disconnected."); setBusy(true); stop.disabled = true; };

      document.getElementById("form").onsubmit = (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        add("user", text);
        socket.send(JSON.stringify({ type: "message", text }));
        input.value = "";
        reply = null;
        setBusy(true);
      };
      stop.onclick = () => socket.send(JSON.stringify({ type: "stop" }));
      document.getElementById("yes").onclick = () => answer(true);
      document.getElementById("no").onclick = () => answer(false);
    </script>
  </body>
</html>
